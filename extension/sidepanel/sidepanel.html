<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="ui.docTitle">Absorb</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <link rel="stylesheet" href="js/visual/visual.css" />
</head>
<body>
  <header class="app-header">
    <!-- 品牌全名由系统标题栏承担，页面内不再放 logo（单放图形锚点视觉突兀），仅保留操作按钮 -->
    <div class="header-actions">
      <!-- 历史按钮：时钟 SVG 图标（原"历史"文本）；提示走 data-tip 气泡（按钮下方弹出），i18n 经 data-i18n-tip / data-i18n-aria 同步，不用原生 title（避免与 CSS 气泡叠加） -->
      <button id="toggleHistory" class="icon-btn" data-i18n-tip="ui.historyTip" data-i18n-aria="ui.historyTip" data-tip="查看历史" aria-label="查看历史"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
      <!-- 新会话按钮：气泡+加号 SVG 图标（参考"新消息"图形，原"＋新"文本），提示机制同上 -->
      <button id="newSession" class="icon-btn" data-i18n-tip="ui.newTip" data-i18n-aria="ui.newTip" data-tip="新对话" aria-label="新对话"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M12 8v6"/><path d="M9 11h6"/></svg></button>
    </div>
  </header>

  <main class="main">
    <!-- 对话消息流 -->
    <section class="messages" id="messages" aria-live="polite">
      <div class="empty-tip" id="emptyTip">
        <div class="empty-illustration" aria-hidden="true">
          <img src="../icons/Artwork.png" alt="" width="140" height="140">
        </div>
        <p class="empty-title" data-i18n="ui.emptyTitle">从阅读开始，深入理解</p>
        <p data-i18n="ui.emptyTip1">围绕当前网页提问，探索内容背后的观点与知识。</p>
        <!-- 桌面端未安装引导：宿主注册缺失时由 desktop-guide.js 显示（只读探测，不拉起进程） -->
        <div class="desktop-guide" id="desktopGuide" hidden>
          <div class="dg-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <p class="dg-title" data-i18n="desktopGuide.title">需要 Absorb 桌面端</p>
          <p class="dg-desc" data-i18n="desktopGuide.desc">未检测到桌面端（可能未安装，或正在升级/更新）。插件负责划词与提问，AI 回答由本机桌面端完成。</p>
          <div class="dg-actions">
            <button id="dgDownload" class="primary-btn dg-primary" data-i18n="desktopGuide.download">下载桌面端</button>
            <button id="dgRecheck" class="ghost-btn" data-i18n="desktopGuide.recheck">我已安装，重新检测</button>
          </div>
        </div>
      </div>
    </section>
    <!-- 网页建议问题块（doc-suggestions §4.4）：普通网页问题块——视觉归属内容区（灰底 --bg），
         脱离 composer 白底域；位置仍在提问框上方（main 尾部固定不随滚动），
         与输入区的边界由 composer 白底 + 上缘分隔线产生 -->
    <div class="web-chips" id="webChips" hidden></div>
  </main>

  <!-- 重连条：连接失败时显示，固定于对话区与输入区之间（不随消息滚动） -->
  <div class="reconnect-bar" id="reconnectBar" hidden>
    <span id="reconnectMsg"></span>
    <button id="reconnectBtn" class="ghost-btn" data-i18n="buttons.reconnect">重连</button>
  </div>

  <!-- 输入区 -->
  <footer class="composer">
    <!-- 文档工具栏（PDF 解读 PR4）：输入框上方的单行条，活动标签页为 PDF 时显示；
         ⌄ 展开文档信息/建议问题/操作面板，四态由 doccard.js 渲染，× 仅隐藏展示不删记录 -->
    <section class="docbar" id="docCard" hidden></section>
    <!-- 图片附件行：区域/元素/视口截图、上传、粘贴的图片以 chip 缩略图展示（不进输入框、不持久化） -->
    <div class="attachments" id="attachments" hidden></div>
    <!-- 可编辑输入框：划词以 chip 标签内嵌，可多段、可删除、光标在标签间移动 -->
    <div class="input-shell editable" id="questionInput" contenteditable="true"
         spellcheck="true" data-i18n-placeholder="placeholders.inputNoQuote" data-placeholder="右键划词后,以标签插入;可多段划词并在标签间输入问题"></div>
    <div class="composer-actions">
      <button id="imageBtn" class="icon-btn" type="button" aria-haspopup="menu" aria-expanded="false"
              aria-label="插入图片" data-i18n-aria="ui.imageTip">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.6-3.6a2 2 0 0 0-2.8 0L6 20"/></svg>
      </button>
      <!-- × 隐藏文档工具栏后的迷你恢复入口（仅图标圆标，doccard.js 渲染；置于发送左侧） -->
      <span id="docMiniSlot" hidden></span>
      <!-- 发送按钮：空闲=向上箭头 SVG（与 render.js ASK_ICON 同形），流式中=停止方块（JS 切换 innerHTML）；
           文案走 title/aria-label，不用 data-i18n（textContent 会清掉内嵌图标） -->
      <button id="askBtn" class="primary-btn" disabled data-i18n-aria="buttons.ask" aria-label="发送"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
    </div>
    <!-- 隐藏的文件选择：由“上传图片”菜单项触发 -->
    <input type="file" id="imageFile" accept="image/*" hidden />
  </footer>

  <!-- 历史抽屉 -->
  <aside class="history-drawer" id="historyDrawer" hidden>
    <div class="drawer-header">
      <span data-i18n="ui.historyTitle">历史对话</span>
      <div class="drawer-actions">
        <button id="restoreHistory" class="text-btn" data-i18n="ui.restoreHistory">拉取历史会话</button>
        <button id="closeHistory" class="icon-btn" aria-label="关闭历史">×</button>
      </div>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </aside>

  <!-- 软提示 toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- 第三方库（vendor/，本地打包原因见 vendor/README.md，MV3 CSP 禁止远程脚本） -->
  <link rel="stylesheet" href="vendor/highlight.github.min.css" />
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
