    width: 440px; height: 280px; box-sizing: border-box;
    display: flex; align-items: center; gap: 28px; padding: 0 36px;

  .blob { position: absolute; border-radius: 50%; }

            background: radial-gradient(closest-side, rgba(0, 102, 204, .08), transparent); }
  .ring { position: absolute; width: 120px; height: 120px; border-radius: 50%;
          border: 2px solid rgba(0, 102, 204, .14); right: 44px; bottom: -38px; }
  .icon {
    width: 88px; height: 88px; border-radius: 22px; flex: none;
    box-shadow: 0 8px 22px rgba(29, 29, 31, .16), 0 2px 6px rgba(29, 29, 31, .10);
  }
  .text { display: flex; flex-direction: column; gap: 9px; position: relative; }
  h1 { margin: 0; font-size: 28px; line-height: 1.15; color: #1d1d1f; letter-spacing: .2px; font-weight: 700; }
  .tag { margin: 0; font-size: 17px; color: #424245; }
  .plat { margin: 3px 0 0; font-size: 12px; color: #86868b; }
</style>
