model:
  name: ""            # 模型名（如 glm-4.6）；首次配置前为空，状态页会提示
  variant: "glm"      # 提示词策略：glm
  api_key: ""         # API Key（首次配置前为空）
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  temperature: 0.7
  # max_tokens 不配置 = 输出上限由模型侧决定

store:
  sqlite:
    path: "./data/sessions.db"

memory:
  enabled: true
  db_path: "./data/memory.db"
  profile:
    enabled: true
    file_path: "./data/profile.md"

proxy:
  url: ""             # 全局 HTTP 代理（如 http://127.0.0.1:7897），空=跟随系统代理/环境变量

embedding:
  api_key: ""         # 硅基流动 API Key，空 = 禁用语义检索（纯词法兜底）
  # base_url: ""      # 空 = https://api.siliconflow.cn/v1（OpenAI 兼容 /v1/embeddings）
  # model: ""         # 空 = BAAI/bge-m3
  # batch_size: 32    # 索引期单批文本数

  # 精排（可选）：rerank_model 为云模型名（复用上方 api_key/base_url，/v1/rerank）
  # rerank_model: ""  # 如 BAAI/bge-reranker-v2-m3；空 = 禁用精排
  # rerank_top_n: 8   # 精排候选数

  # 本地语义检索（离线，provider: local）：llama-server 子进程，零 API 成本
  # provider: "local"
  # server_exe: "D:/path/llama-server.exe"
  # model_path: "D:/path/bge-small-zh-v1.5-f16.gguf"
  # port: 8935
  # 本地精排（local 模式可选）：CPU 上每候选约 0.7s（Q8_0），top_n 按延迟预算选择
  # rerank_model_path: "D:/path/bge-reranker-v2-m3-Q8_0.gguf"
  # rerank_port: 8937

fetch:
  timeout_seconds: 30

upgrade:
  # channel: "stable"          # stable / beta
  # feed_url: ""               # 升级 feed 地址，空=默认（仓库 releases/latest.json）
  # check_interval_hours: 6    # 启动后自动检查间隔
  # auto_check: true           # 启动时后台检查（有新版仅提示，不自动安装）

skills:
  root: ""            # 空 = 内置技能兜底（exe 旁 skills/ → 工作目录 skills/ → 内嵌解压到用户缓存目录）；配置则只用该目录

logs:
  dir: "./logs"
  level: "info"

# 生产链路追踪（默认关）：开启后 span 落盘 logs/traces.jsonl（消息正文已剔除）；
# 加 sqlite: true 改落会话库 request_traces 表并开放 /debug/traces 查看器；
# 配置 endpoint 则直发 OTLP（如本机 Jaeger 的 gRPC 端口 4317），不落盘。
# telemetry:
#   enabled: true
#   # sqlite: true
#   # debug_port: 7789
#   # endpoint: "localhost:4317"
#   # service_name: "absorb"
