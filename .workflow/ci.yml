# Absorb CI —— Gitee Go 流水线（质量门禁）
#
# 说明：
# - Gitee Go 内置 Golang 插件仅支持到 Go 1.16、Node 插件仅到 14.x，
#   无法满足本项目（Go 1.26 + Vite 6），故使用 GCC 插件（Ubuntu 20.04，
#   含 gcc/wget/zip）作为通用脚本环境，自行安装工具链。
# - go vet / go test 依赖内嵌资源 frontend/dist 与 internal/extension/extension_bundle.zip，
#   因此先构建前端、打包扩展，再做 Go 检查（与本地 make release 顺序一致）。
# - Windows 安装程序（Inno Setup）无法在 Linux 运行机构建，发布安装包仍走本地 make installer。
#
# 结构注意：Gitee Go 的 stages 列表项必须直接携带 name/displayName/strategy/steps
# 字段（不得再包一层 stage: 键），steps[].commands 必须是列表。
version: '1.0'
name: absorb-ci
displayName: 'Absorb CI（Go + 前端质量门禁）'
triggers:
  push:
    branches:
      precise:
        - master
  pr:
    branches:
      precise:
        - master
stages:
  - name: ci
    displayName: '构建与测试'
    strategy: naturally
    steps:
      - step: build@gcc
        name: quality_gate
        displayName: '前端构建测试 + Go 静态检查与单测'
        gccVersion: '10.3'
        commands:
          - |
            set -e
            ROOT=$(pwd)

            echo '===== 1. 安装系统依赖（Wails Linux CGO 头文件 + zip） ====='
            apt-get update -qq
            apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.0-dev >/dev/null
            command -v zip >/dev/null || apt-get install -y -qq zip

            echo '===== 2. 安装 Go 1.26 ====='
            cd /tmp
            wget -q https://mirrors.aliyun.com/golang/go1.26.0.linux-amd64.tar.gz -O go.tgz \
              || wget -q https://golang.google.cn/dl/go1.26.0.linux-amd64.tar.gz -O go.tgz
            tar -xzf go.tgz -C /usr/local
            ln -sf /usr/local/go/bin/go /usr/local/bin/go
            ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
            go version

            echo '===== 3. 安装 Node.js 24（本地同版本；20.18 会因 require(ESM) 未启用导致 vitest/jsdom 启动失败） ====='
            wget -q https://cdn.npmmirror.com/binaries/node/v24.12.0/node-v24.12.0-linux-x64.tar.gz -O node.tgz
            tar -xzf node.tgz -C /usr/local --strip-components=1
            node -v && npm -v
            cd "$ROOT"

            echo '===== 4. 前端：依赖安装 / 构建 / 单元测试 ====='
            npm config set registry https://registry.npmmirror.com
            cd frontend
            npm ci --no-audit --no-fund
            npm run build
            npx vitest run
            cd "$ROOT"

            echo '===== 5. 打包扩展内嵌资源（对应本地 pack-assets） ====='
            cd extension
            zip -qr ../internal/extension/extension_bundle.zip .
            cd "$ROOT"

            echo '===== 6. Go 静态检查（Windows 目标：nativehost 依赖 windows/registry，Linux 目标下 build constraints 会排除全部文件） ====='
            export GOPROXY=https://goproxy.cn,direct
            GOOS=windows GOARCH=amd64 go vet ./...

            echo '===== 7. Windows 目标交叉编译检查 ====='
            mkdir -p /tmp/win_check
            GOOS=windows GOARCH=amd64 go build -o /tmp/win_check/ .

            echo '===== 8. Go 测试编译验证（Linux 无法运行 Windows 测试二进制，执行交由 GitHub Actions windows runner / 本地 make test-go） ====='
            mkdir -p /tmp/win_tests
            GOOS=windows GOARCH=amd64 go test -c -o /tmp/win_tests/ ./...
